version: "3.9"
# Integration test compose — runs pytest against a real PostgreSQL/pgvector DB
# Usage: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  db_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: broker_test
      POSTGRES_USER: broker_test
      POSTGRES_PASSWORD: test_password_integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker_test -d broker_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://broker_test:test_password_integration@db_test:5432/broker_test
      - DATABASE_URL_SYNC=postgresql://broker_test:test_password_integration@db_test:5432/broker_test
      - SECRET_KEY=integration-test-secret-key-32-chars-ok
      - APP_ENV=testing
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=node2vec
    depends_on:
      db_test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m pytest tests/ tests_integration/ -v --tb=short -x"
    volumes:
      - ./backend:/app
      - test_results:/app/test-results

volumes:
  test_results:
